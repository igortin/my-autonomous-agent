[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "langchain",
    "langgraph",
    "langsmith",
    "langchain-openai",
    "pydantic",
    "trustcall",
    "kubernetes",
    "pyyaml",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]